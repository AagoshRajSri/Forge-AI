services:
  - type: web
    name: forge-ai-server
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: forge-redis
          type: redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://forge-ai-server.onrender.com
      - key: BETTER_AUTH_CALLBACK_URL
        value: https://forge-ai-server.onrender.com/api/auth/callback
      - key: TRUSTED_ORIGINS
        value: https://forge-ai-server.onrender.com
      - key: HF_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false

  - type: redis
    name: forge-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: forge-db
    databaseName: forgeai
    user: forgeai_user
    plan: free
