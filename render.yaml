services:
  - type: web
    name: forge-ai-server
    runtime: node
    plan: standard
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: forge-redis
          type: redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_CALLBACK_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false

  - type: redis
    name: forge-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: forge-db
    databaseName: forgeai
    user: forgeai_user
    plan: free
